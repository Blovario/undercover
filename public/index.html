<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101124"><title>Undercover — Le jeu entre amis</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:#f6f4ff;background:#101124}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 80% -10%,#34215d 0,transparent 55%),#101124}.app{max-width:520px;margin:auto;min-height:100dvh;padding:27px 19px 55px}.logo{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:1px;font-size:23px}.logo b{background:#b799ff;color:#171027;padding:8px;border-radius:12px}.hero{padding:45px 0 26px}.eyebrow{font-size:12px;letter-spacing:2.5px;font-weight:800;text-transform:uppercase;color:#b6a1ff}h1{font-size:39px;letter-spacing:-1.8px;line-height:1.1;margin:10px 0 12px}h2{font-size:25px;letter-spacing:-.6px;margin:12px 0}p{color:#a9a6c2;line-height:1.55}.panel{background:#1b1c34;border:1px solid #35344f;border-radius:22px;padding:22px;margin:18px 0;box-shadow:0 12px 40px #06071333}.label{display:block;color:#c4c1d9;font-weight:700;margin-bottom:9px;font-size:13px}input{width:100%;font-size:17px;color:white;background:#111326;border:1px solid #44425d;border-radius:13px;padding:15px 13px;outline:0;margin-bottom:15px}input:focus{border-color:#ae8eff}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:15px 17px;font-weight:800;min-height:49px}button:disabled{opacity:.36;cursor:not-allowed}.primary{background:#ae8cff;color:#1a102f;width:100%}.secondary{background:#30304c;color:white;width:100%}.danger{color:#fcb0bc;background:#552b3d}.plain{background:transparent;color:#e9dcff;padding:6px}.outline{background:#22233f;color:white;border:1px solid #565273}.stack{display:grid;gap:10px}.section-title{font-size:11px;letter-spacing:2px;color:#aba7c5;text-transform:uppercase;font-weight:800;margin:20px 0 10px}.code{font-size:43px;font-weight:900;letter-spacing:7px;color:#c4aaff;text-align:center}.center{text-align:center}.small{font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.player{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #32334b}.player:last-child{border:0}.avatar{width:35px;height:35px;flex:0 0 35px;background:#44376d;color:#f0e9ff;border-radius:11px;display:grid;place-items:center;font-weight:900}.name{flex:1;margin-left:12px;font-weight:700}.muted{color:#8c89a4}.pill{font-size:11px;color:#cfb7ff;background:#382d59;border-radius:100px;padding:5px 9px;font-weight:800}.stepper{display:flex;align-items:center;gap:16px}.stepper button{background:#353255;color:white;width:42px;height:42px;min-height:42px;padding:0;font-size:23px}.toggle{width:48px;height:27px;background:#515169;border-radius:100px;padding:4px;cursor:pointer}.toggle.on{background:#ae8cff}.toggle:after{content:'';display:block;background:#fff;width:19px;height:19px;border-radius:100%;transition:transform .2s}.toggle.on:after{transform:translateX(21px)}.secret{background:linear-gradient(145deg,#3b2865,#251b49);border:1px solid #7257af;border-radius:22px;padding:28px 18px;margin:20px 0;text-align:center}.word{font-size:34px;letter-spacing:-1px;font-weight:900;margin:24px 0}.hidden-word{filter:blur(12px);user-select:none}.vote{display:flex;width:100%;background:#2d2b48;color:white;align-items:center;justify-content:space-between;margin:8px 0;text-align:left}.vote.active{outline:2px solid #c2a5ff}.vote:disabled{opacity:.4}.result{background:#29213e;border-radius:16px;padding:18px;margin-top:14px}.warning{color:#ffb3bf}.success{color:#b6f6c6}.hidden{display:none!important}.spacer{height:10px}.footer{font-size:12px;text-align:center;margin-top:28px;color:#6f6c85}.toast{position:fixed;bottom:25px;left:20px;right:20px;max-width:480px;margin:auto;background:#ffe2e4;color:#521d37;border-radius:15px;padding:14px 18px;font-weight:700;box-shadow:0 10px 50px #0008;z-index:30}.chip{background:#262641;border-radius:100px;color:#cfcbe4;padding:7px 11px;display:inline-block;font-size:12px}.bigicon{font-size:43px}.reveal-btn{min-height:70px;touch-action:none}a{color:#c4aaff}.vote-count{font-variant-numeric:tabular-nums}</style></head><body><main class="app"><header class="row"><div class="logo"><b>U</b> UNDERCOVER</div><span class="chip">Édition soirée</span></header><div id="screen"></div><div class="footer">100 paires de mots · 3 à 20 joueurs · Un téléphone chacun</div></main><div id="toast" class="toast hidden"></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({reconnection:true});const $=id=>document.getElementById(id);const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=null,uncovered=false,voteChoice=null, joining=false;
const session=()=>{try{return JSON.parse(localStorage.getItem('undercover-session')||'null')}catch{return null}};
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3800)}
function btn(text,action,cls='primary',disabled=false){return `<button class="${cls}" ${disabled?'disabled':''} onclick="${action}">${text}</button>`}
const panel=s=>`<div class="panel">${s}</div>`;
const people=s=>s.players.map(p=>`<div class="player"><div class="avatar">${safe(p.name.charAt(0).toUpperCase())}</div><div class="name">${safe(p.name)} ${p.id===s.host?'<span class="pill">HÔTE</span>':''} ${p.id===s.me?'<span class="muted small">(toi)</span>':''}<div class="small muted">${p.out?'Éliminé':!p.connected?'Hors ligne':s.phase==='vote'&&p.voted?'A voté':'En jeu'}</div></div>${s.phase==='lobby'&&s.me===s.host&&p.id!==s.host?`<button class="plain warning" onclick="socket.emit('kick','${p.id}')">✕</button>`:''}</div>`).join('');
function home(){const q=new URLSearchParams(location.search).get('code')||'';$('screen').innerHTML=`<section class="hero"><div class="eyebrow">Qui ment parmi vous ?</div><h1>Même mot.<br>Presque.</h1><p>Décris ton mot sans te faire démasquer. Trouve les Undercover… et méfie-toi de Mr White.</p></section>${panel(`<label class="label" for="name">Ton prénom</label><input id="name" maxlength="22" autocomplete="nickname" placeholder="Ex. Alex" value="${safe(session()?.name||'')}"><div class="stack">${btn('Créer un salon →','join(false)')}<div class="center small muted">OU REJOINDRE TES AMIS</div><input id="code" maxlength="6" placeholder="Code à 6 caractères" style="text-align:center;letter-spacing:3px;text-transform:uppercase;margin:0" value="${safe(q)}">${btn('Rejoindre avec un code','join(true)','secondary')}</div>`)}`;}
function join(withCode){const name=$('name')?.value.trim(),code=withCode?$('code')?.value.trim().toUpperCase():'';if(!name)return toast('Entre ton prénom.');if(withCode&&code.length!==6)return toast('Le code doit avoir 6 caractères.');socket.emit('join',{name,code});joining=true;}
function render(){if(!state)return home();const s=state,isHost=s.me===s.host,alive=s.players.filter(p=>!p.out),me=s.players.find(p=>p.id===s.me);let html=`<div class="row" style="margin-top:27px"><span class="eyebrow">SALON ${safe(s.code)}</span><span class="chip">${s.players.length} joueur${s.players.length>1?'s':''}</span></div>`;
if(s.phase==='lobby'){
 const maxU=Math.max(1,s.players.length-2-(s.settings.white?1:0));
 html+=`<h1>Tout le monde est là ?</h1>${panel(`<div class="center small muted">Partage ce code avec tes amis</div><div class="code">${safe(s.code)}</div>${btn('Copier le lien d’invitation','copyLink()','secondary')}<div class="section-title">Joueurs dans le salon</div>${people(s)}`)}`;
 if(isHost)html+=panel(`<div class="eyebrow">Paramètres de la partie</div><div class="row" style="margin-top:22px"><div><b>Undercover</b><div class="small muted">Reçoivent un mot différent</div></div><div class="stepper"><button onclick="settings(${s.settings.undercover-1},${s.settings.white})">−</button><strong>${s.settings.undercover}</strong><button onclick="settings(${s.settings.undercover+1},${s.settings.white})">+</button></div></div><hr style="border:0;border-top:1px solid #393752;margin:22px 0"><div class="row"><div><b>Mr White</b><div class="small muted">N’a aucun mot à découvrir</div></div><div class="toggle ${s.settings.white?'on':''}" role="switch" aria-checked="${s.settings.white}" onclick="settings(${s.settings.undercover},${!s.settings.white})"></div></div><p class="small">Au moins 2 civils. Maximum ${Math.max(1,maxU)} Undercover avec ces joueurs.</p><div class="spacer"></div>${btn('Lancer la partie →',"socket.emit('start')",'primary',s.players.length<3||s.settings.undercover>maxU)}`);
 else html+=panel(`<div class="center"><div class="bigicon">⏳</div><h2>L’hôte prépare la partie</h2><p>Tu es prêt ! Ne quitte pas cette page.</p></div>`);
}
else{
 html+=`<div class="row" style="margin-top:14px"><span class="chip">Manche ${s.round}</span><span class="chip">${alive.length} encore en jeu</span></div>`;
 if(s.phase==='reveal'){
 html+=`<h1>Découvre ton identité</h1><p>Cache ton écran. Tu es la seule personne qui doit voir ton rôle.</p><div class="secret"><span class="eyebrow">TON RÔLE</span><h2 style="color:${s.myRole==='civil'?'#b8f1cf':s.myRole==='white'?'#ffffff':'#eec29e'}">${s.myRole==='civil'?'CIVIL':s.myRole==='white'?'MR WHITE':'UNDERCOVER'}</h2><div class="word ${uncovered?'':'hidden-word'}">${s.myRole==='white'?'AUCUN MOT':safe(s.myWord)}</div><p>${s.myRole==='white'?'Tu dois improviser à partir des indices des autres.':s.myRole==='civil'?'Décris subtilement ton mot.':'Fais croire aux autres que tu as leur mot.'}</p><button class="secondary reveal-btn" onpointerdown="reveal(true)" onpointerup="reveal(false)" onpointercancel="reveal(false)" onpointerleave="reveal(false)">Maintenir pour voir le mot 👁</button></div>`;
 if(isHost)html+=btn('Tout le monde a vu ? Commencer',"socket.emit('phase','discussion')");else html+=`<p class="center">L’hôte lancera la discussion.</p>`;
 }
 if(s.phase==='discussion'){
 const turn=s.players.find(p=>p.id===s.turn);html+=`<h1>À vous de parler !</h1>${panel(`<div class="eyebrow">Premier joueur suggéré</div><h2>${safe(turn?.name||'À vous de choisir')}</h2><p>Chacun dit un mot ou un indice à l’oral, à tour de rôle, sans révéler son mot secret.</p><span class="chip">${me.out?'Tu es éliminé':`Ton rôle : ${s.myRole==='civil'?'Civil':s.myRole==='undercover'?'Undercover':'Mr White'}`}</span>`)}${panel(`<div class="section-title">Joueurs encore en jeu</div>${people(s)}`)}`;
 if(isHost)html+=btn('Passer au vote →',"socket.emit('phase','vote')");else html+='<p class="center">L’hôte déclenchera le vote.</p>';
 }
 if(s.phase==='vote'){
 html+=`<h1>Qui est suspect ?</h1><p>Chaque joueur encore en jeu vote sur son propre téléphone. Le vote est secret jusqu’au résultat.</p>${panel(`<div class="row"><b>Votes enregistrés</b><b class="vote-count">${s.votesCount}/${alive.length}</b></div><div class="spacer"></div>${s.canVote?alive.filter(p=>p.id!==s.me).map(p=>`<button class="vote ${voteChoice===p.id?'active':''}" onclick="choose('${p.id}')"><span>${safe(p.name)}</span><span>${voteChoice===p.id?'✓':'◯'}</span></button>`).join('')+btn('Valider mon vote', 'castVote()', 'primary',!voteChoice):`<p>${me.out?'Tu es éliminé et ne votes plus.':'Vote envoyé ! En attente des autres…'}</p>`}`)}`;
 }
 if(s.phase==='result'||s.phase==='whiteGuess'){
 const r=s.result;html+=`<h1>${r.tie?'Égalité !':'Le verdict'}</h1>${panel(`<div class="center"><div class="bigicon">${r.tie?'🤝':'🎭'}</div><h2>${r.tie?'Personne n’est éliminé':safe(r.out?.name)+' est éliminé'}</h2><p>${r.tie?'Les votes sont à égalité.':'Rôle : '+(r.out?.role==='civil'?'Civil':r.out?.role==='white'?'Mr White':'Undercover')}</p></div><div class="section-title">Votes</div>${r.tallies.map(x=>`<div class="row" style="padding:8px 0"><span>${safe(x.name)}</span><strong>${x.votes}</strong></div>`).join('')}${r.whiteGuess?`<div class="result">Proposition Mr White : <b>${safe(r.whiteGuess.text)}</b> — ${r.whiteGuess.good?'Correct !':'Raté !'}</div>`:''}`)}`;
 if(s.phase==='whiteGuess'){html+=s.whiteGuesser===s.me?panel(`<h2>Dernière chance, Mr White !</h2><p>Devine le mot des civils. Une bonne réponse te fait gagner.</p><input id="guess" placeholder="Le mot des civils">${btn('Tenter ma chance','guessWord()')}`):panel('<p>Mr White tente de deviner le mot des civils…</p>');}
 else if(isHost)html+=btn('Manche suivante →',"socket.emit('phase','continue')");
 }
 if(s.phase==='finished'){
 html+=`<div class="center" style="padding-top:32px"><div class="bigicon">🏆</div><h1>Victoire !</h1><h2 style="color:#c6aaff">${safe(s.winner)}</h2></div>${panel(`<div class="section-title">Les identités sont révélées</div>${s.revealAll.map(p=>`<div class="player"><div class="name" style="margin:0">${safe(p.name)}<div class="small muted">${p.role==='civil'?'Civil':p.role==='undercover'?'Undercover':'Mr White'}</div></div><b>${safe(p.word||'Aucun mot')}</b></div>`).join('')}`)}${isHost?btn('Rejouer avec le même groupe',"socket.emit('phase','lobby')"):'<p class="center">L’hôte peut relancer une partie.</p>'}`;
 }
}
$('screen').innerHTML=html;
}
function settings(undercover,white){socket.emit('settings',{undercover,white})}
function reveal(val){uncovered=val;const el=document.querySelector('.word');if(el)el.classList.toggle('hidden-word',!val)}
function choose(id){voteChoice=id;render()}
function castVote(){if(!voteChoice)return;socket.emit('vote',voteChoice);voteChoice=null}
function guessWord(){const t=$('guess').value.trim();if(t)socket.emit('whiteGuess',t)}
function copyLink(){const link=location.origin+location.pathname+'?code='+state.code;navigator.clipboard?.writeText(link).then(()=>toast('Lien copié !')).catch(()=>prompt('Copie ce lien :',link))||prompt('Copie ce lien :',link)}
socket.on('joined',x=>{localStorage.setItem('undercover-session',JSON.stringify(x));history.replaceState({},'',location.pathname+'?code='+x.code);joining=false;});
socket.on('state',s=>{const oldPhase=state?.phase;state=s;if(oldPhase!==s.phase){uncovered=false;voteChoice=null;}render();});
socket.on('gameError',msg=>{if(msg.includes('Salon introuvable')||msg.includes('La partie a commencé')){localStorage.removeItem('undercover-session');state=null;joining=false;history.replaceState({},'',location.pathname);home();toast('Ancien salon expiré. Crée un nouveau salon ou rejoins tes amis avec leur code.');}else{if(!state)home();toast(msg);}});socket.on('kicked',()=>{localStorage.removeItem('undercover-session');state=null;home();toast('Tu as été retiré du salon.');});socket.on('displaced',()=>{state=null;home();toast('Session ouverte sur un autre appareil.');});
socket.on('connect',()=>{const prior=session();if(prior){if(!state)home();socket.emit('join',prior);}else home()});socket.on('disconnect',()=>toast('Connexion interrompue. Reconnexion en cours…'));
home();
</script></body></html>
